<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found — DECTO</title>
  <style>
    :root {
      --bg: #f7f7f7;
      --text: #111214;
      --muted: #6d7075;
      --line: #dedfe2;
      --max: 640px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 85% 10%, rgba(210,212,215,.5), transparent 28%),
        radial-gradient(circle at 10% 30%, rgba(235,235,235,.75), transparent 32%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    a { color: inherit; }
    .container { width: min(100%, var(--max)); }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: .16em;
      text-decoration: none;
      margin-bottom: 56px;
    }
    .logo-mark {
      width: 24px; height: 24px;
      border: 2px solid var(--text);
      border-radius: 7px;
      display: grid; place-items: center;
      transform: rotate(45deg);
    }
    .logo-mark span { width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
    .code {
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1;
    }
    h1 {
      margin-top: 18px;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      letter-spacing: -.02em;
    }
    p {
      margin-top: 14px;
      color: var(--muted);
      font-size: .96rem;
      line-height: 1.6;
    }
    .actions {
      margin-top: 36px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: .9rem;
      text-decoration: none;
      transition: transform .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: #151619; color: #fff; }
    .btn-secondary { border: 1px solid var(--line); background: rgba(255,255,255,.7); }
  </style>
  <!-- Analytics — privacy-friendly, no cookies. TODO: sign up free at goatcounter.com,
       create a site, then replace YOURCODE below with your GoatCounter site code. -->
  <script data-goatcounter="https://decto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="container">
    <a href="index.html" class="logo">
      <span class="logo-mark"><span></span></span>
      DECTO
    </a>

    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>The page you're looking for may have moved or was never here. Head back to explore live market data and everything DECTO is building.</p>

    <div class="actions">
      <a href="index.html" class="btn btn-primary">Back to DECTO</a>
      <a href="index.html#market" class="btn btn-secondary">View Market Data</a>
    </div>
  </div>
</body>
</html>
